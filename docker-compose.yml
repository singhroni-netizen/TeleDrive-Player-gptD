services:
  teledrive-api:
    build:
      context: ./backend
    container_name: teledrive-player-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /srv/data
    ports:
      - "${API_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/srv/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
